<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>鸣潮国际服账号登录</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #7367f0;
      --primary-soft: #edeafd;
      --primary-hover: #685dd8;
      --warning: #ff9f43;
      --warning-soft: #fff2e2;
      --info: #00bad1;
      --info-soft: #e0f7fa;
      --page: #f7f7f9;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --text: #2f2b3d;
      --muted: #6d6b77;
      --border: #e6e5e8;
      --shadow-sm: 0 2px 8px rgba(47, 43, 61, .08);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--page); }
    body { margin: 0; min-height: 100vh; padding: 48px 20px; background: var(--page); color: var(--text); font-size: 14px; line-height: 1.5; }
    button, input { font: inherit; }
    button, label, input[type="checkbox"], input[type="radio"] { cursor: pointer; }
    .auth-shell { width: min(100%, 620px); margin: 0 auto; }
    .page-header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
    .brand-icon { display: grid; flex: 0 0 46px; width: 46px; height: 46px; place-items: center; border-radius: 12px; background: var(--primary-soft); color: var(--primary); }
    .brand-icon svg { width: 25px; height: 25px; }
    .line-icon { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    h1 { margin: 0 0 2px; font-size: 25px; line-height: 1.25; letter-spacing: -.02em; }
    .page-subtitle { margin: 0; color: var(--muted); font-size: 13px; }
    .section-card { padding: 24px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-sm); }
    .section-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .eyebrow { display: block; margin-bottom: 4px; color: var(--primary); font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    h2 { margin: 0; font-size: 18px; line-height: 1.35; }
    .lead { margin: 5px 0 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .section-icon { display: grid; flex: 0 0 42px; width: 42px; height: 42px; place-items: center; border-radius: 10px; background: var(--primary-soft); color: var(--primary); }
    .section-icon svg { width: 21px; height: 21px; }
    form { margin: 0; }
    .field { display: grid; gap: 7px; margin: 0 0 16px; color: var(--muted); font-size: 12px; font-weight: 600; }
    input[type="email"], input[type="password"] { width: 100%; min-height: 42px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 7px; outline: 0; background: var(--surface-raised); color: var(--text); cursor: text; transition: border-color .18s ease, box-shadow .18s ease; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    input[type="checkbox"], input[type="radio"] { width: 17px; height: 17px; margin: 0; accent-color: var(--primary); }
    .btn { display: inline-flex; width: 100%; min-height: 42px; align-items: center; justify-content: center; gap: 7px; padding: 9px 15px; border: 1px solid transparent; border-radius: 8px; background: var(--primary); color: #fff; font-weight: 600; line-height: 1; box-shadow: 0 3px 8px rgba(115, 103, 240, .28); transition: background-color .18s ease, box-shadow .18s ease, transform .18s ease; }
    .btn:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-1px); }
    .btn:disabled { cursor: wait; opacity: .55; }
    .status { min-height: 0; margin: 16px 0 0; padding: 11px 13px; border: 1px solid rgba(255, 159, 67, .28); border-radius: 9px; background: var(--warning-soft); color: var(--text); line-height: 1.5; }
    .status:empty { display: none; }
    .hidden { display: none !important; }
    .players { display: grid; gap: 10px; margin: 18px 0; }
    .player { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; margin: 0; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-raised); transition: border-color .18s ease, box-shadow .18s ease; }
    .player:hover { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .player span { min-width: 0; }
    .player strong, .player small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .player small { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .default { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--muted); font-size: 12px; font-weight: 600; }
    .code { margin: 20px 0; padding: 20px 12px; border: 1px solid rgba(115, 103, 240, .28); border-radius: 10px; background: var(--primary-soft); color: var(--primary); text-align: center; font: 700 clamp(30px, 10vw, 48px) ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .14em; }
    .security-note { display: flex; align-items: flex-start; gap: 11px; margin-top: 16px; padding: 13px 14px; border: 1px solid rgba(0, 186, 209, .28); border-radius: 10px; background: var(--info-soft); }
    .security-note svg { flex: 0 0 19px; width: 19px; margin-top: 1px; color: var(--info); }
    .security-note p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .security-note strong { color: var(--text); }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --primary-soft: rgba(115, 103, 240, .18); --warning-soft: rgba(255, 159, 67, .16); --info-soft: rgba(0, 186, 209, .16); --page: #25293c; --surface: #2f3349; --surface-raised: #363a50; --text: #e7e3fc; --muted: #b6b3c2; --border: #44485f; --shadow-sm: 0 2px 10px rgba(12, 14, 22, .22); }
    }
    @media (max-width: 560px) {
      body { padding: 22px 12px; }
      .page-header { gap: 10px; margin-bottom: 16px; }
      .brand-icon { flex-basis: 40px; width: 40px; height: 40px; }
      h1 { font-size: 20px; }
      .section-card { padding: 18px 16px; }
      .section-heading { margin-bottom: 18px; }
      .section-icon { display: none; }
      .player { grid-template-columns: auto minmax(0, 1fr); }
      .default { grid-column: 2; }
    }
  </style>
</head>
<body>
<main class="auth-shell">
  <header class="page-header">
    <span class="brand-icon" aria-hidden="true">
      <svg class="line-icon" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"></path></svg>
    </span>
    <div><h1>鸣潮国际服数据工具</h1><p class="page-subtitle">安全绑定国际服账号</p></div>
  </header>

  <article class="section-card">
    <div class="section-heading">
      <div><span class="eyebrow">Wuthering Waves · Global</span><h2>绑定国际服账号</h2><p class="lead" id="lead">凭据仅用于本次登录，不会保存密码。完成网页步骤后，还需回到发起登录的 QQ 会话确认。</p></div>
      <span class="section-icon" aria-hidden="true"><svg class="line-icon" viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5zM12 15v2"></path></svg></span>
    </div>

    <section id="login-stage">
      <form id="login-form">
        <label class="field"><span>国际服邮箱</span><input id="email" type="email" autocomplete="username" maxlength="320" placeholder="name@example.com" required></label>
        <label class="field"><span>密码</span><input id="password" type="password" autocomplete="current-password" maxlength="256" placeholder="请输入账号密码" required></label>
        <div id="captcha"></div>
        <button id="login-button" class="btn" type="submit">登录并读取 UID</button>
      </form>
    </section>

    <section id="select-stage" class="hidden">
      <div class="section-heading"><div><span class="eyebrow">账号角色</span><h2>选择要绑定的 UID</h2><p class="lead">至少选择一个，并指定一个默认 UID。未选择的已有绑定不会被删除。</p></div></div>
      <form id="select-form">
        <div id="players" class="players"></div>
        <button id="select-button" class="btn" type="submit">生成 QQ 确认码</button>
      </form>
    </section>

    <section id="confirm-stage" class="hidden">
      <div class="section-heading"><div><span class="eyebrow">最后一步</span><h2>回到 QQ 完成确认</h2></div></div>
      <div id="confirmation-code" class="code"></div>
      <p class="lead">在原 QQ 会话发送：<strong>/kh 登录确认 上方确认码</strong></p>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </article>

  <aside class="security-note">
    <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5m0-9h.01"></path></svg>
    <p><strong>安全提醒：</strong>不要把登录链接、验证码或页面内容转发给他人。关闭页面会清除浏览器内的临时会话。</p>
  </aside>
</main>
<script>
(() => {
  "use strict";
  const marker = "/login/";
  const markerIndex = location.pathname.lastIndexOf(marker);
  const apiBase = markerIndex >= 0 ? location.pathname.slice(0, markerIndex + marker.length - 1) : "";
  const initialToken = markerIndex >= 0 ? decodeURIComponent(location.pathname.slice(markerIndex + marker.length)) : "";
  const state = { sessionToken: "", csrfToken: "", geetest: null, players: [] };
  const $ = (id) => document.getElementById(id);
  const status = (message) => { $("status").textContent = message || ""; };
  const busy = (button, value) => { button.disabled = value; };

  async function post(path, payload) {
    const response = await fetch(`${apiBase}/${path}`, {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    let data = {};
    try { data = await response.json(); } catch (_) { /* 显示统一错误 */ }
    if (!response.ok) throw new Error(data.message || data.error || "请求失败，请重新发起登录");
    return data;
  }

  async function exchange() {
    if (!apiBase || !initialToken || initialToken === "session") throw new Error("登录链接无效或已过期");
    const data = await post("exchange", { link_token: initialToken });
    state.sessionToken = data.session_token;
    state.csrfToken = data.csrf_token;
    history.replaceState({}, "", `${apiBase}/session`);
  }

  async function submitCredentials(event, geetest = null) {
    if (event) event.preventDefault();
    const button = $("login-button");
    busy(button, true);
    status("正在安全登录并读取账号 UID…");
    try {
      const data = await post("submit", {
        session_token: state.sessionToken,
        csrf_token: state.csrfToken,
        email: $("email").value,
        password: $("password").value,
        geetest,
      });
      if (data.status === "risk") {
        status("需要完成人机验证。验证成功后会自动继续。");
        await showGeetest(data.captcha_id);
        return;
      }
      $("password").value = "";
      state.players = Array.isArray(data.players) ? data.players : [];
      renderPlayers();
      $("login-stage").classList.add("hidden");
      $("select-stage").classList.remove("hidden");
      status("");
    } catch (error) {
      status(error.message);
    } finally {
      busy(button, false);
    }
  }

  async function showGeetest(captchaId) {
    if (!captchaId) throw new Error("人机验证配置无效");
    if (!window.initGeetest4) {
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://static.geetest.com/v4/gt4.js";
        script.onload = resolve;
        script.onerror = () => reject(new Error("无法加载人机验证"));
        document.head.appendChild(script);
      });
    }
    window.initGeetest4({ captchaId, product: "bind" }, (captcha) => {
      state.geetest = captcha;
      captcha.appendTo("#captcha");
      captcha.onSuccess(() => {
        const value = captcha.getValidate() || {};
        submitCredentials(null, value);
      });
      captcha.showCaptcha();
    });
  }

  function renderPlayers() {
    const host = $("players");
    host.replaceChildren();
    state.players.forEach((player, index) => {
      const row = document.createElement("div"); row.className = "player";
      const selected = document.createElement("input"); selected.type = "checkbox"; selected.name = "uid";
      selected.value = player.uid; selected.checked = true;
      const text = document.createElement("span");
      const title = document.createElement("strong"); title.textContent = player.player_name ? `${player.player_name} · ${player.uid}` : player.uid;
      const meta = document.createElement("small"); meta.textContent = `${player.region_name || player.region_id}${player.level == null ? "" : ` · Lv.${player.level}`}`;
      text.append(title, meta);
      const defaultLabel = document.createElement("label"); defaultLabel.className = "default";
      const defaultRadio = document.createElement("input"); defaultRadio.type = "radio"; defaultRadio.name = "default_uid";
      defaultRadio.value = player.uid; defaultRadio.checked = index === 0;
      defaultLabel.append(defaultRadio, document.createTextNode("默认"));
      defaultRadio.addEventListener("change", () => { if (defaultRadio.checked) selected.checked = true; });
      selected.addEventListener("change", () => { if (!selected.checked && defaultRadio.checked) defaultRadio.checked = false; });
      row.append(selected, text, defaultLabel); host.append(row);
    });
  }

  async function selectPlayers(event) {
    event.preventDefault();
    const button = $("select-button"); busy(button, true); status("正在生成确认码…");
    try {
      const selected = [...document.querySelectorAll('input[name="uid"]:checked')].map((item) => item.value);
      const defaultItem = document.querySelector('input[name="default_uid"]:checked');
      const data = await post("select", {
        session_token: state.sessionToken,
        csrf_token: state.csrfToken,
        selected_uids: selected,
        default_uid: defaultItem ? defaultItem.value : "",
      });
      $("confirmation-code").textContent = data.confirmation_code;
      $("select-stage").classList.add("hidden");
      $("confirm-stage").classList.remove("hidden");
      status("确认码仅可使用一次，并会很快过期。");
    } catch (error) { status(error.message); } finally { busy(button, false); }
  }

  $("login-form").addEventListener("submit", submitCredentials);
  $("select-form").addEventListener("submit", selectPlayers);
  exchange().catch((error) => {
    $("login-form").querySelectorAll("input,button").forEach((item) => { item.disabled = true; });
    status(error.message);
  });
})();
</script>
</body>
</html>
